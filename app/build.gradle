plugins { id 'com.android.application' }
android {
    namespace 'dev.nelson.ridewatch'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.nelson.ridewatch'
        minSdk 36
        targetSdk 36
        versionCode 11
        versionName '0.7.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { testImplementation 'junit:junit:4.13.2'; implementation project(':core'); implementation 'com.google.android.gms:play-services-location:21.3.0' }
