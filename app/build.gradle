plugins { id 'com.android.application' }
android {
    namespace 'dev.nelson.ridewatch'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.nelson.ridewatch'
        minSdk 36
        targetSdk 36
        versionCode 10
        versionName '0.6.4'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { testImplementation 'junit:junit:4.13.2'; implementation project(':core') }
