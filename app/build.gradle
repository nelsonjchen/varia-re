plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'com.mindflakes.ridewatch'
    compileSdk 36
    defaultConfig {
        applicationId 'com.mindflakes.ridewatch'
        minSdk 36
        targetSdk 36
        versionCode 26
        versionName '0.12.1'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { testImplementation 'junit:junit:4.13.2'; implementation project(':core'); implementation 'com.google.android.gms:play-services-location:21.3.0' }

kotlin { jvmToolchain(17) }
