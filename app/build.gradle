plugins { id 'com.android.application' }
android {
    namespace 'dev.nelson.ridewatch'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.nelson.ridewatch'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { testImplementation 'junit:junit:4.13.2'; implementation project(':core'); coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5' }
